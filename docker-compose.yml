services:
  postgres:
    image: postgres:17-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-financial_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    pull_policy: never
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-financial_copilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-financial-copilot-api}:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    environment: &application-environment
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${ASPNETCORE_FORWARDEDHEADERS_ENABLED:-false}
      ConnectionStrings__FinancialCopilot: Host=postgres;Port=5432;Database=${POSTGRES_DB:-financial_copilot};Username=${POSTGRES_USER:-financial_copilot};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrationsOnStartup: "true"
      DataSyncMessaging__Enabled: "true"
      DataSyncMessaging__HostName: rabbitmq
      DataSyncMessaging__UserName: ${RABBITMQ_USER:-financial_copilot}
      DataSyncMessaging__Password: ${RABBITMQ_PASSWORD}
      FeatureMessaging__HostName: rabbitmq
      FeatureMessaging__Enabled: "true"
      FeatureMessaging__UserName: ${RABBITMQ_USER:-financial_copilot}
      FeatureMessaging__Password: ${RABBITMQ_PASSWORD}
      ScannerCache__UseRedis: "true"
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_ORIGIN:?set FRONTEND_PUBLIC_ORIGIN in .env}
      Cors__AllowedOrigins__1: ${FRONTEND_PUBLIC_ORIGIN_ALT:-https://sapio.ir}
      Authentication__JwtBearer__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      OpenApi__Enabled: ${OPENAPI_ENABLED:-false}
      OpenApi__ServerUrl: ${OPENAPI_SERVER_URL:-}
      AiProvider__DefaultProvider: ${AI_PROVIDER_DEFAULT_PROVIDER:-OpenAI}
      AiProvider__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AiProvider__OpenAI__Model: ${OPENAI_MODEL:-gpt-5.6-luna}
      AiModelProviders__Providers__0__ModelKey: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AiProvider__Abravran__MaxTokens: ${ABRAVRAN_MAX_TOKENS:-3000}
      AiProvider__Abravran__Temperature: ${ABRAVRAN_TEMPERATURE:-0.7}
      AiModelProviders__Providers__1__Enabled: ${ABRAVRAN_ENABLED:-false}
      ABRAVRAN_API_KEY: ${ABRAVRAN_API_KEY:-}
      Telegram__Membership__RequiredChannelId: ${TELEGRAM_REQUIRED_CHANNEL_ID:-}
      Telegram__Membership__BotTokenEnvironmentVariable: ${TELEGRAM_BOT_TOKEN_ENVIRONMENT_VARIABLE:-TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NadpcoApi__UserName: ${NADPCO_API_USER_NAME:-}
      NadpcoApi__Password: ${NADPCO_API_PASSWORD:-}
      NadpcoScheduledSync__Enabled: ${NADPCO_SCHEDULED_SYNC_ENABLED:-false}
      TsetmcWebService__Enabled: ${TSETMC_WEB_SERVICE_ENABLED:-false}
      TsetmcWebService__ServiceUrl: ${TSETMC_WEB_SERVICE_URL:-http://service.tsetmc.com/WebService/TsePublicV2.asmx}
      TsetmcWebService__UserName: ${TSETMC_WEB_SERVICE_USER_NAME:-}
      TsetmcWebService__Password: ${TSETMC_WEB_SERVICE_PASSWORD:-}
      MarketQuoteSourcePriority__PrimarySourceName: ${MARKET_QUOTE_PRIMARY_SOURCE:-TsetmcWebService}
      TsetmcPolling__Enabled: ${TSETMC_POLLING_ENABLED:-true}
      TsetmcWebService__TimeoutSeconds: ${TSETMC_WEB_SERVICE_TIMEOUT_SECONDS:-60}
      TsetmcWebService__RetryCount: ${TSETMC_WEB_SERVICE_RETRY_COUNT:-3}
      TsetmcWebService__IntradayTradeFlows__0: ${TSETMC_INTRADAY_FLOW_0:-0}
      TsetmcWebService__IntradayTradeFlows__1: ${TSETMC_INTRADAY_FLOW_1:-1}
      TsetmcWebService__IntradayTradeFlows__2: ${TSETMC_INTRADAY_FLOW_2:-2}
      TsetmcWebService__IntradayTradeFlows__3: ${TSETMC_INTRADAY_FLOW_3:-3}
      TsetmcWebService__IntradayTradeFlows__4: ${TSETMC_INTRADAY_FLOW_4:-4}
      TsetmcWebService__IntradayTradeFlows__5: ${TSETMC_INTRADAY_FLOW_5:-5}
      TsetmcWebService__InstrumentFlows__0: ${TSETMC_INSTRUMENT_FLOW_0:-5}
      TsetmcWebService__InstrumentFlows__1: ${TSETMC_INSTRUMENT_FLOW_1:-6}
      TsetmcWebService__InstrumentFlows__2: ${TSETMC_INSTRUMENT_FLOW_2:-7}
      TsetmcWebService__DailyTradeFromDate: ${TSETMC_DAILY_TRADE_FROM_DATE:-20260601}
      TsetmcWebService__DailyIndexFromDate: ${TSETMC_DAILY_INDEX_FROM_DATE:-20260601}
      CyclicalWaves__BaseAddress: ${CYCLICAL_WAVES_BASE_ADDRESS:-https://back1.cyclicalwaves.com/api/}
      CyclicalWaves__UserName: ${CYCLICAL_WAVES_USER_NAME:-}
      CyclicalWaves__Password: ${CYCLICAL_WAVES_PASSWORD:-}
      CyclicalWaves__TimeoutSeconds: ${CYCLICAL_WAVES_TIMEOUT_SECONDS:-30}
      CyclicalWaves__RetryCount: ${CYCLICAL_WAVES_RETRY_COUNT:-2}
      CyclicalWaves__CircuitBreakSeconds: ${CYCLICAL_WAVES_CIRCUIT_BREAK_SECONDS:-60}
      CyclicalWaves__CircuitFailureThreshold: ${CYCLICAL_WAVES_CIRCUIT_FAILURE_THRESHOLD:-5}
      CyclicalWavesPsVisualization__Enabled: ${CYCLICAL_WAVES_PS_VISUALIZATION_ENABLED:-true}
      CyclicalWavesPsVisualization__EnableStandaloneGauge: ${CYCLICAL_WAVES_STANDALONE_GAUGE:-true}
      CyclicalWavesPsVisualization__IncludeGaugeInMonthlySalesTrendChart: ${CYCLICAL_WAVES_INCLUDE_GAUGE_IN_MONTHLY_TREND:-true}
      CyclicalWavesPsVisualization__IncludeHistoryInStandaloneGauge: ${CYCLICAL_WAVES_INCLUDE_HISTORY:-true}
      CyclicalWavesPsVisualization__AllowStaleStandaloneGauge: ${CYCLICAL_WAVES_ALLOW_STALE:-true}
      CyclicalWavesPsVisualization__MaxSyncAgeHours: ${CYCLICAL_WAVES_MAX_SYNC_AGE_HOURS:-48}
      CyclicalWavesPsVisualization__MaxObservationLagTradingDays: ${CYCLICAL_WAVES_MAX_LAG_TRADING_DAYS:-2}
      CyclicalWavesPsVisualization__MaxHistoryPoints: ${CYCLICAL_WAVES_MAX_HISTORY_POINTS:-5000}
      CyclicalWavesPsVisualization__DisplayPercentageDecimals: ${CYCLICAL_WAVES_PERCENTAGE_DECIMALS:-2}
      NoavaranCurrentApi__BaseAddress: ${NOAVARAN_API_BASE_ADDRESS:-https://data3.nadpco.com/}
      NoavaranCurrentApi__UserName: ${NOAVARAN_API_USER_NAME:-}
      NoavaranCurrentApi__Password: ${NOAVARAN_API_PASSWORD:-}
      NoavaranCurrentApi__TimeoutSeconds: ${NOAVARAN_API_TIMEOUT_SECONDS:-30}
      NoavaranCurrentApi__RetryCount: ${NOAVARAN_API_RETRY_COUNT:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_PORT:-5074}:8080"

  worker:
    image: ${WORKER_IMAGE:-financial-copilot-worker}:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *application-environment
      DataSyncMessaging__ConsumerCount: ${DATA_SYNC_CONSUMER_COUNT:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-financial-copilot-frontend}:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      FINANCIAL_COPILOT_API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
