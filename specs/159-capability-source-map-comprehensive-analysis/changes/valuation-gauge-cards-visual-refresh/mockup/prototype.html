<!doctype html>
<!--
  PROTOTYPE — design proposal only (Status: Proposed — not approved). Not production code.
  P/E values: شاراک production card of 2026-11-26. P/S and equilibrium values: illustrative.
  Query: ?view=single|trio  &theme=light|dark  &device=desktop|phone
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valuation gauge cards — visual refresh prototype</title>
<style>
@font-face { font-family: "Dastkhat"; src: url("../../../../../src/frontend/public/fonts/dastkhat-main.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Dastkhat FaNum"; src: url("../../../../../src/frontend/public/fonts/dastkhat-fanum-variable.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --background: oklch(0.145 0.005 270); --foreground: oklch(0.93 0.005 270); --card: oklch(0.18 0.005 270);
  --muted-foreground: oklch(0.68 0.01 270); --surface: oklch(0.165 0.005 270); --surface-2: oklch(0.21 0.005 270);
  --hairline: oklch(1 0 0 / 0.08); --primary: oklch(0.72 0.16 160);
  --b1: oklch(0.56 0.13 158); --b2: oklch(0.66 0.13 158); --b3: oklch(0.76 0.09 160);
  --b4: oklch(0.77 0.08 22); --b5: oklch(0.66 0.15 22); --b6: oklch(0.57 0.18 22);
  --t-dark: oklch(0.18 0.01 270); --t-light: oklch(0.99 0 0);
  --warm: oklch(0.74 0.15 30); --cool: oklch(0.76 0.13 160);
  --mark-low: oklch(0.74 0.15 155); --mark-high: oklch(0.70 0.19 25);
  --eq1: oklch(0.55 0.11 235); --eq2: oklch(0.76 0.09 225);
  --pill-warm-bg: oklch(0.74 0.15 30 / 0.16); --pill-warm-fg: oklch(0.84 0.11 40);
  --shadow: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 12px 32px -18px oklch(0 0 0 / 0.7);
}
.light {
  --background: oklch(0.975 0.004 270); --foreground: oklch(0.22 0.01 270); --card: oklch(1 0 0);
  --muted-foreground: oklch(0.46 0.012 270); --surface: oklch(0.965 0.005 270); --surface-2: oklch(0.94 0.008 270);
  --hairline: oklch(0.45 0.012 270 / 0.14); --primary: oklch(0.54 0.14 160);
  --b1: oklch(0.55 0.13 158); --b2: oklch(0.67 0.13 158); --b3: oklch(0.85 0.08 160);
  --b4: oklch(0.86 0.06 22); --b5: oklch(0.70 0.14 22); --b6: oklch(0.58 0.19 22);
  --warm: oklch(0.55 0.17 30); --cool: oklch(0.50 0.13 160);
  --mark-low: oklch(0.50 0.13 155); --mark-high: oklch(0.55 0.21 27);
  --eq1: oklch(0.55 0.12 235); --eq2: oklch(0.84 0.07 225);
  --pill-warm-bg: oklch(0.62 0.17 35 / 0.12); --pill-warm-fg: oklch(0.48 0.15 35);
  --shadow: 0 1px 2px oklch(0.2 0.01 270 / 0.04), 0 16px 36px -22px oklch(0.2 0.01 270 / 0.28);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Dastkhat", Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
.num { font-family: "Dastkhat FaNum", "Dastkhat", Tahoma, sans-serif; font-variant-numeric: tabular-nums; }
.page { max-width: 980px; margin: 0 auto; padding: 28px 24px 40px; }
.phone .page { padding: 14px 12px 28px; }
.ask { margin-inline-start: auto; width: fit-content; background: var(--surface-2); padding: 9px 16px; border-radius: 18px 18px 6px 18px; font-size: 15px; margin-bottom: 16px; }
.answer { display: grid; gap: 14px; }
.answer-head { display: flex; align-items: baseline; gap: 8px; font-size: 15px; color: var(--muted-foreground); }
.answer-head b { color: var(--foreground); font-size: 17px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.span2 { grid-column: 1 / -1; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--hairline); padding: 20px 22px 16px; container-type: inline-size; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kind { display: flex; align-items: baseline; gap: 8px; }
.kind h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.kind span { color: var(--muted-foreground); font-size: 14px; }
.info-btn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--muted-foreground); background: var(--surface); border: 1px solid var(--hairline); }
.body { display: grid; gap: 18px; margin-top: 6px; }
@container (min-width: 620px) { .body.ratio { grid-template-columns: minmax(300px, 1.05fr) 1fr; align-items: center; gap: 26px; } }
.dial-col { display: grid; justify-items: center; gap: 10px; }
.dial-wrap { position: relative; width: 100%; max-width: 380px; margin-inline: auto; container-type: inline-size; }
.dial-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.hero { position: absolute; inset-inline: 0; bottom: 1%; display: grid; justify-items: center; gap: 0; pointer-events: none; }
.hero small { font-size: clamp(11px, 3.3cqi, 13px); color: var(--muted-foreground); }
.hero strong { font-size: clamp(30px, 11.5cqi, 44px); line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--pill-warm-bg); color: var(--pill-warm-fg); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.facts { display: grid; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; }
.stat { padding: 12px 14px; display: grid; gap: 3px; }
.stat + .stat { border-inline-start: 1px solid var(--hairline); }
.stat label { font-size: 12px; color: var(--muted-foreground); }
.stat b { font-size: 21px; font-weight: 800; }
.stat em { font-style: normal; font-size: 12px; color: var(--muted-foreground); }
.warm { color: var(--warm); } .cool { color: var(--cool); }
.history { display: grid; gap: 8px; }
.history-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted-foreground); }
.history-title b { color: var(--foreground); font-size: 14px; }
.strip { position: relative; display: flex; direction: ltr; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; }
.strip i { display: block; height: 100%; }
.strip i.dim { opacity: 0.35; }
.strip-wrap { position: relative; padding-top: 10px; direction: ltr; }
.strip-marker { position: absolute; top: 0; width: 0; height: 0; border-inline: 6px solid transparent; border-top: 8px solid var(--foreground); transform: translateX(-6px); }
.strip-scale { position: relative; height: 16px; direction: ltr; font-size: 11px; color: var(--muted-foreground); }
.strip-scale span { position: absolute; transform: translateX(-50%); top: 2px; }
.sentence { font-size: 14px; line-height: 1.75; margin: 0; }
details { border-top: 1px solid var(--hairline); margin-top: 14px; padding-top: 10px; }
summary { cursor: pointer; font-size: 13px; color: var(--muted-foreground); list-style: none; display: flex; align-items: center; gap: 6px; min-height: 32px; }
summary::before { content: "‹"; transform: rotate(-90deg); display: inline-block; font-size: 15px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; margin-top: 4px; font-size: 12px; color: var(--muted-foreground); }
.foot .note { display: inline-flex; gap: 6px; align-items: center; }
/* Equilibrium price band */
.band { display: grid; gap: 14px; margin-top: 8px; }
.band-track-wrap { position: relative; direction: ltr; padding: 54px 10px 34px; }
.band-track { height: 16px; border-radius: 999px; background: linear-gradient(90deg, var(--eq2), var(--eq1)); position: relative; }
.band-mid { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--foreground); left: 50%; border-radius: 2px; }
.band-pin { position: absolute; top: 6px; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; }
.band-pin .bubble { background: var(--foreground); color: var(--card); font-weight: 800; font-size: 15px; padding: 5px 11px; border-radius: 10px; white-space: nowrap; direction: rtl; }
.band-pin .stem { width: 2px; height: 22px; background: var(--foreground); }
.band-pin .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--card); border: 3px solid var(--foreground); margin-top: -4px; }
.band-scale { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 26px; font-size: 12px; color: var(--muted-foreground); }
.band-scale span { position: absolute; transform: translateX(-50%); display: grid; justify-items: center; line-height: 1.3; direction: rtl; }
.band-scale span b { color: var(--foreground); font-size: 14px; }
/* iOS segmented control */
.segmented { display: none; position: relative; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 3px; height: 40px; }
.segmented button { position: relative; z-index: 1; border: 0; background: none; color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; border-radius: 9px; }
.segmented .thumb { position: absolute; top: 3px; bottom: 3px; inset-inline-start: 3px; width: calc((100% - 6px) / 3); background: var(--card); border-radius: 9px; box-shadow: 0 2px 8px -2px oklch(0 0 0 / 0.25), 0 0 0 0.5px var(--hairline); }
.phone .segmented { display: grid; }
.phone .grid2 { grid-template-columns: 1fr; }
.trio .kind span { display: none; }
.phone .trio .card[data-kind="ps"], .phone .trio .card[data-kind="eq"] { display: none; }
.phone .card { padding: 16px 14px 12px; border-radius: 20px; }
.phone .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.phone .stat { padding: 10px 10px; }
.phone .stat b { font-size: 18px; }
.caption { margin-top: 18px; font-size: 12px; color: var(--muted-foreground); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .sweep { transition: transform 700ms cubic-bezier(.2,.8,.2,1); } }
</style>
</head>
<body>
<div class="page">
  <div class="ask" id="ask"></div>
  <div class="answer" id="answer"></div>
  <div class="caption">نمونهٔ طراحی پیشنهادی · دادهٔ P/E از کارت تولیدی شاراک؛ دادهٔ P/S و بازهٔ تعادلی نمونه است</div>
</div>
<script>
const q = new URLSearchParams(location.search);
const view = q.get("view") ?? "single";
if (q.get("theme") !== "dark") document.documentElement.classList.add("light");
if (q.get("device") === "phone") document.documentElement.classList.add("phone");

// ---- formatting (proposed rule) ----
const fa = (s) => s.replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const ratio = (v) => fa(Number(v).toFixed(2)).replace(".", "٫");               // P/E, P/S: two decimals
const pct = (v, sign) => (sign && v > 0 ? "‎+" : v < 0 ? "‎−" : "") + fa(Math.abs(v).toFixed(1)).replace(".", "٫") + "٪";
const rial = (v) => fa(Math.round(v).toLocaleString("en-US")).replace(/,/g, "٬"); // prices: whole rials

// ---- data ----
const pe = { title: "P/E", label: "P/E امروز", current: 6.999044944, start: 2.1059510085, min: 3.3487316736139543,
  avg: 5.880866117458263, max: 9.693612328874726, end: 59.613521843, days: [414, 1483, 1412, 1161, 634, 662] };
const ps = { title: "P/S", label: "P/S امروز", current: 1.8312, start: 0.62, min: 0.98, avg: 1.64, max: 2.71, end: 6.4,
  days: [180, 905, 1410, 1302, 701, 268] };
const eq = { lower: 3800, mid: 4400, upper: 5000, price: 4120 };

// ---- geometry (unchanged approved rule: start 0°, min 30°, avg 90°, max 150°, end 180°) ----
const CX = 170, CY = 168, R = 138, r = 96;
const pt = (a, rad) => { const t = Math.PI - (a * Math.PI) / 180; return [CX + rad * Math.cos(t), CY - rad * Math.sin(t)]; };
const arc = (a0, a1, ro, ri) => { const [x0, y0] = pt(a0, ro), [x1, y1] = pt(a1, ro), [x2, y2] = pt(a1, ri), [x3, y3] = pt(a0, ri);
  const l = a1 - a0 > 180 ? 1 : 0; return `M${x0} ${y0}A${ro} ${ro} 0 ${l} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${l} 0 ${x3} ${y3}Z`; };
function edges(g) { return [g.start, g.min, (g.min + g.avg) / 2, g.avg, (g.avg + g.max) / 2, g.max, g.end]; }
function angleOf(g, v) { const e = edges(g); for (let i = 0; i < 6; i++) if (v <= e[i + 1]) return i * 30 + 30 * Math.max(0, (v - e[i]) / (e[i + 1] - e[i])); return 180; }
function shares(days) { const t = days.reduce((a, b) => a + b, 0); return days.map((d) => (100 * d) / t); }

function dial(g) {
  const a = angleOf(g, g.current), active = Math.min(5, Math.floor(a / 30)), sh = shares(g.days);
  let s = `<svg viewBox="-40 -44 420 224" role="img" aria-label="${g.title} ${ratio(g.current)}، بین میانگین و حد بالا" direction="ltr">`;
  // instrument ticks
  for (let t = 0; t <= 180; t += 5) { const big = t % 30 === 0; const [x0, y0] = pt(t, R + 8), [x1, y1] = pt(t, R + (big ? 15 : 11));
    s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--muted-foreground)" stroke-opacity="${big ? 0.55 : 0.25}" stroke-width="${big ? 1.4 : 1}"/>`; }
  for (let i = 0; i < 6; i++) {
    const on = i === active, a0 = i * 30 + (i ? 0.9 : 0), a1 = i * 30 + 30 - (i < 5 ? 0.9 : 0);
    s += `<path d="${arc(a0, a1, on ? R + 4 : R, on ? r - 4 : r)}" fill="var(--b${i + 1})" ${on ? 'stroke="var(--foreground)" stroke-width="1.5"' : 'opacity="0.92"'}/>`;
    let la = i * 30 + 15;
    const [tx, ty] = pt(la, (R + r) / 2), light = i === 2 || i === 3;
    s += `<text x="${tx}" y="${ty + 4.5}" text-anchor="middle" font-size="${on ? 13 : 12.5}" font-weight="${on ? 800 : 700}" class="num" fill="var(${light ? "--t-dark" : "--t-light"})">${pct(sh[i])}</text>`;
  }
  // bound markers: a short stem with a dot outside the scale; low = green, average = foreground, high = red
  const mark = (angle, color) => { const [x0, y0] = pt(angle, R + 1), [x1, y1] = pt(angle, R + 17);
    return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="3.6" fill="${color}"/>`; };
  const lab = (angle, name, value, anchor, color, dy = 0) => { const [x, y] = pt(angle, R + 30);
    return `<text x="${x}" y="${y + dy}" text-anchor="${anchor}" class="num" fill="${color}"><tspan x="${x}" font-size="12" font-weight="700">${name}</tspan><tspan x="${x}" dy="17" font-size="16" font-weight="800">${ratio(value)}</tspan></text>`; };
  s += mark(30, "var(--mark-low)") + mark(90, "var(--foreground)") + mark(150, "var(--mark-high)");
  s += lab(90, "میانگین " + g.title, g.avg, "middle", "var(--foreground)", -24) + lab(30, "حد پایین " + g.title, g.min, "end", "var(--mark-low)", -8) + lab(150, "حد بالا " + g.title, g.max, "start", "var(--mark-high)", -8);
  const [sx, sy] = pt(0, (R + r) / 2), [ex, ey] = pt(180, (R + r) / 2);
  s += `<text x="${sx}" y="${sy + 22}" text-anchor="middle" font-size="11" class="num" fill="var(--muted-foreground)">${ratio(g.start)}</text>`;
  s += `<text x="${ex}" y="${ey + 22}" text-anchor="middle" font-size="11" class="num" fill="var(--muted-foreground)">${ratio(g.end)}</text>`;
  // pointer: outside notch on the scale + inner blade that stops at the band edge (keeps band labels readable)
  const [n0x, n0y] = pt(a, R + 7), [n1x, n1y] = pt(a, R + 22), [i0x, i0y] = pt(a, r - 22), [i1x, i1y] = pt(a, r + 9), [hx, hy] = pt(a, r - 22);
  s += `<g class="sweep"><line x1="${n0x}" y1="${n0y}" x2="${n1x}" y2="${n1y}" stroke="var(--foreground)" stroke-width="3" stroke-linecap="round"/>`;
  s += `<line x1="${i0x}" y1="${i0y}" x2="${i1x}" y2="${i1y}" stroke="var(--card)" stroke-width="7" stroke-linecap="round"/>`;
  s += `<line x1="${i0x}" y1="${i0y}" x2="${i1x}" y2="${i1y}" stroke="var(--foreground)" stroke-width="3" stroke-linecap="round"/>`;
  s += `<circle cx="${hx}" cy="${hy}" r="6" fill="var(--card)" stroke="var(--foreground)" stroke-width="3"/></g></svg>`;
  return { svg: s, active, sh, a };
}

function ratioCard(g, kindKey) {
  const d = dial(g), sh = d.sh, below = sh.slice(0, d.active).reduce((x, y) => x + y, 0), here = sh[d.active];
  const dist = (100 * (g.current - g.avg)) / g.avg;
  const cum = sh.reduce((acc, v) => [...acc, (acc.at(-1) ?? 0) + v], []);
  const marker = (cum[d.active] - here / 2);
  const strip = sh.map((v, i) => `<i style="width:${v}%;background:var(--b${i + 1})" class="${i === d.active ? "" : ""}"></i>`).join("");
  return `<section class="card" data-kind="${kindKey}" aria-label="گیج ${g.title} شاراک">
    <div class="card-head"><div class="kind"><h3>گیج ${g.title}</h3><span>شاراک · پتروشیمی شازند</span></div></div>
    <div class="body ratio">
      <div class="dial-col"><div class="dial-wrap">${d.svg}
        <div class="hero"><strong class="num">${ratio(g.current)}</strong><small>${g.label}</small></div></div>
        <span class="pill">بین میانگین و حد بالا</span></div>
      <div class="facts">
        <div class="stats">
          <div class="stat"><label>میانگین تاریخی</label><b class="num">${ratio(g.avg)}</b><em>مرکز گیج</em></div>
          <div class="stat"><label>فاصله تا میانگین</label><b class="num ${dist > 0 ? "warm" : "cool"}">${pct(dist, true)}</b><em>${dist > 0 ? "گران‌تر از میانگین" : "ارزان‌تر از میانگین"}</em></div>
          <div class="stat"><label>روزهای ارزان‌تر</label><b class="num">${pct(below)}</b><em>زیر بازهٔ امروز</em></div>
        </div>
        <div class="history">
          <div class="history-title"><b>تاریخچه در یک نگاه</b><span class="num">${fa(String(g.days.reduce((a, b) => a + b, 0)))} روز معاملاتی</span></div>
          <div class="strip-wrap"><span class="strip-marker" style="left:${marker}%"></span><div class="strip">${strip}</div></div>
          <div class="strip-scale num"><span style="left:${cum[0]}%;color:var(--mark-low);font-weight:700">${ratio(g.min)}</span><span style="left:${cum[2]}%;color:var(--foreground);font-weight:700">${ratio(g.avg)}</span><span style="left:${cum[4]}%;color:var(--mark-high);font-weight:700">${ratio(g.max)}</span></div>
          <p class="sentence">در <b class="num">${pct(below)}</b> روزها ${g.title} پایین‌تر از بازهٔ امروز بوده و <b class="num">${pct(here)}</b> روزها در همین بازه.</p>
        </div>
      </div>
    </div>
    <details><summary>راهنمای خواندن گیج و جزئیات عددی</summary></details>
    <div class="foot"><span class="note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>${g.title} یک نسبت بنیادی است، نه توصیهٔ خرید یا فروش.</span><span class="num">تحلیل‌اپ · دریافت ۵ آذر ۱۴۰۵</span></div>
  </section>`;
}

function eqCard() {
  const pos = (v) => (100 * (v - eq.lower)) / (eq.upper - eq.lower);
  const vsMid = (100 * (eq.price - eq.mid)) / eq.mid, vsLow = (100 * (eq.price - eq.lower)) / eq.lower;
  return `<section class="card span2" data-kind="eq" aria-label="بازهٔ قیمت تعادلی شاراک">
    <div class="card-head"><div class="kind"><h3>بازهٔ قیمت تعادلی</h3><span>شاراک · پتروشیمی شازند</span></div></div>
    <div class="band">
      <div class="band-track-wrap">
        <div class="band-pin" style="left:calc(10px + (100% - 20px) * ${pos(eq.price) / 100})"><span class="bubble num">${rial(eq.price)} ریال</span><span class="stem"></span><span class="dot"></span></div>
        <div class="band-track"><span class="band-mid"></span></div>
        <div class="band-scale num"><span style="left:0%">حد پایین<b>${rial(eq.lower)}</b></span><span style="left:50%">میانه<b>${rial(eq.mid)}</b></span><span style="left:100%">حد بالا<b>${rial(eq.upper)}</b></span></div>
      </div>
      <div class="stats">
        <div class="stat"><label>جایگاه</label><b>نیمهٔ پایین بازه</b><em>زیر میانه</em></div>
        <div class="stat"><label>تا میانهٔ بازه</label><b class="num cool">${pct(vsMid, true)}</b><em>نسبت به ${rial(eq.mid)}</em></div>
        <div class="stat"><label>بالای حد پایین</label><b class="num">${pct(vsLow, true)}</b><em>نسبت به ${rial(eq.lower)}</em></div>
      </div>
    </div>
    <div class="foot"><span class="num">قیمت: آخرین روز معاملاتی · نوآوران امین · ۴ آذر ۱۴۰۵، ۱۲:۳۰</span><span class="num">بازه: تحلیل‌اپ · دریافت ۵ آذر ۱۴۰۵</span></div>
  </section>`;
}

const ask = document.getElementById("ask"), answer = document.getElementById("answer");
if (view === "single") { ask.textContent = "گیج P/E شاراک"; answer.innerHTML = ratioCard(pe, "pe"); }
else {
  ask.textContent = "گیج‌های ارزش‌گذاری شاراک";
  answer.innerHTML = `<div class="answer-head"><b>گیج‌های ارزش‌گذاری شاراک</b><span>پتروشیمی شازند</span></div>
    <div class="segmented" role="tablist" aria-label="نوع گیج"><span class="thumb"></span><button role="tab" aria-selected="true">P/E</button><button role="tab">P/S</button><button role="tab">قیمت تعادلی</button></div>
    <div class="grid2 trio">${ratioCard(pe, "pe")}${ratioCard(ps, "ps")}${eqCard()}</div>`;
}
</script>
</body>
