    "cautions": [
      "InsCode is not a database column: it maps to InstrumentCode; InstrumentId (ISIN-like) maps to InstrumentIsin; ExternalInstrumentId is a deterministic adapter GUID derived from InsCode.",
      "The current company linker matches InsCode text to Companies.InstrumentCode, chooses the most recently synchronized match then Id, and does not filter Companies.ProviderName. InstrumentCode has no unique constraint on Companies; preserve this as a possible ambiguous/cross-provider mapping and do not replace it with ticker/name matching.",
      "Market ingestion can create minimal instrument stub rows for unknown InsCode values; labels/type/ISIN and company link may remain incomplete until an instruments refresh.",
      "Configured TSETMC instrument flows are documented as equity/ETF/rights; no reviewed InstrumentKind dictionary proves a full security/index taxonomy. Index observations still reference this dimension but index classification must use verified source mappings.",
