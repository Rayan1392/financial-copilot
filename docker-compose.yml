  worker:
    image: ${WORKER_IMAGE:-financial-copilot-worker}:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *application-environment
      DataSyncMessaging__ConsumerCount: ${DATA_SYNC_CONSUMER_COUNT:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-financial-copilot-frontend}:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      FINANCIAL_COPILOT_API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"

