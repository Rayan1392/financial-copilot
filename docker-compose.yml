services:
  postgres:
    image: postgres:17-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-financial_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    pull_policy: never
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-financial_copilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-financial-copilot-api}:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment: &application-environment
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${ASPNETCORE_FORWARDEDHEADERS_ENABLED:-false}
      ConnectionStrings__FinancialCopilot: Host=postgres;Port=5432;Database=${POSTGRES_DB:-financial_copilot};Username=${POSTGRES_USER:-financial_copilot};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrationsOnStartup: "true"
      DataSyncMessaging__Enabled: "true"
      DataSyncMessaging__HostName: rabbitmq
      DataSyncMessaging__UserName: ${RABBITMQ_USER:-financial_copilot}
      DataSyncMessaging__Password: ${RABBITMQ_PASSWORD}
      FeatureMessaging__HostName: rabbitmq
      FeatureMessaging__Enabled: "true"
      FeatureMessaging__UserName: ${RABBITMQ_USER:-financial_copilot}
      FeatureMessaging__Password: ${RABBITMQ_PASSWORD}
      ScannerCache__UseRedis: "true"
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_ORIGIN:?set FRONTEND_PUBLIC_ORIGIN in .env}
      Cors__AllowedOrigins__1: ${FRONTEND_PUBLIC_ORIGIN_ALT:-https://sapio.ir}
      Authentication__JwtBearer__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      OpenApi__Enabled: ${OPENAPI_ENABLED:-false}
      OpenApi__ServerUrl: ${OPENAPI_SERVER_URL:-}
      AiProvider__DefaultProvider: ${AI_PROVIDER_DEFAULT_PROVIDER:-OpenAI}
      AiProvider__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AiProvider__OpenAI__Model: ${OPENAI_MODEL:-gpt-5.6-luna}
      AiProvider__DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
      FinancialDataProvider__ApiKey: ${FINANCIAL_DATA_PROVIDER_API_KEY:-}
