<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#09090b" />
    <title>اتصال برقرار نیست — ساپیو</title>
    <style>
      /* Static fallback served by the service worker when a page cannot load (Feature 153 spec §9.5).
         Inline styles and the system font: nothing here may depend on the network. */
      :root {
        color-scheme: dark;
        --background: #09090b;
        --surface: #141417;
        --foreground: #ececef;
        --muted: #9a9aa3;
        --emerald: #34c38f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        line-height: 1.8;
        text-align: center;
      }
      main { max-width: 22rem; }
      .tile {
        display: flex;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: rgba(52, 195, 143, 0.12);
        box-shadow: inset 0 0 0 1px rgba(52, 195, 143, 0.3);
      }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--emerald); }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: var(--emerald);
        color: #06110c;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid rgba(52, 195, 143, 0.5); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="tile" aria-hidden="true"><div class="dot"></div></div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>پس از اتصال دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش مجدد</button>
    </main>
  </body>
</html>
